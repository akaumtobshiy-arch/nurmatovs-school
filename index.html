<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nurmatov's School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;600&display=swap&subset=cyrillic,latin-ext" rel="stylesheet">
<style>
:root{
  --navy:#0B2A5B; --navy-2:#143A78; --gold:#C9972B; --gold-2:#E3BB5C;
  --bg:#FBF8F0; --card:#FFFFFF; --ink:#14213D; --muted:#5B6882; --line:rgba(11,42,91,.15);
  --accent:#0B2A5B; --on-accent:#FFFFFF; --soft:#F3EDDD;
  --serif:"Playfair Display","Georgia","Times New Roman",serif;
  --read:"Source Serif 4","Georgia",serif;
  --ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --read-size:19px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1730; --card:#10234A; --ink:#F2EBDA; --muted:#A9B5CD; --line:rgba(227,187,92,.28);
    --accent:#E3BB5C; --on-accent:#0B2A5B; --soft:#0F2147;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1730; --card:#10234A; --ink:#F2EBDA; --muted:#A9B5CD; --line:rgba(227,187,92,.28);
  --accent:#E3BB5C; --on-accent:#0B2A5B; --soft:#0F2147;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html.on-home{background:var(--navy)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.view[hidden]{display:none}

/* gear */
.gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:30;width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--gold);background:var(--card);display:grid;place-items:center;color:var(--accent);box-shadow:0 2px 10px rgba(11,42,91,.18)}
.gear svg{width:24px;height:24px}
.gear:hover svg{transform:rotate(40deg);transition:transform .3s}

/* HOME */
.home{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 90% at 50% 30%,var(--navy-2) 0%,var(--navy) 62%,#071C40 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,5vh,44px);padding:70px 20px 40px}
.home .gear{background:rgba(255,255,255,.08);color:var(--gold-2)}
.logo-big{width:min(80vw,46vh,420px);aspect-ratio:1;border-radius:50%;object-fit:cover;display:block;
  box-shadow:0 0 0 6px rgba(227,187,92,.35),0 24px 60px rgba(0,0,0,.45);animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.enter{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--navy);border:0;border-radius:999px;
  font-family:var(--serif);font-weight:800;font-size:1.35rem;padding:.75em 3.2em;letter-spacing:.02em;
  box-shadow:0 8px 24px rgba(0,0,0,.35);animation:rise 1s .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .15s,box-shadow .15s}
.enter:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.4)}
.enter:active{transform:translateY(1px)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* LIST */
.wrap{max-width:860px;margin:0 auto;padding:16px 18px 60px}
.top{display:flex;align-items:center;gap:14px;padding-right:56px;margin-bottom:18px}
.logo-sm{width:56px;height:56px;border-radius:50%;border:0;padding:0;background:none;flex:none;box-shadow:0 0 0 2px var(--gold)}
.logo-sm img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1,h2{font-family:var(--serif);margin:0;line-height:1.15;color:var(--accent)}
.top h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;padding:.8em 1em .8em 2.8em;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:1.05rem}
.search input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(201,151,43,.3)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.35em 1em;font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stat{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.95rem;margin-bottom:6px}
.bar{flex:1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));width:0}
.cont{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px dashed var(--gold);background:transparent;border-radius:14px;padding:.7em 1em;margin:8px 0 16px;font-weight:600;color:var(--accent)}
.rows{list-style:none;margin:0;padding:0;border-top:2px solid var(--gold)}
.row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row .open{display:flex;align-items:center;gap:14px;flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.thumb{width:84px;height:62px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:100%}
.row .t{min-width:0}
.row h2{font-size:1.25rem;font-weight:600}
.row .sub{color:var(--muted);font-size:.92rem;margin-top:2px}
.pill{display:inline-block;border:1.5px solid var(--gold);color:var(--accent);border-radius:8px;padding:0 .5em;font-weight:600;font-size:.82rem;margin-right:8px}
.done{color:var(--gold);font-weight:700}
.heart{background:none;border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.heart svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.heart[aria-pressed="true"]{color:#C0392B}
.heart[aria-pressed="true"] svg{fill:currentColor}
.empty{text-align:center;padding:48px 10px;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);color:var(--accent);font-size:1.3rem;margin-bottom:4px}

/* READER */
.read .wrap{padding-bottom:150px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font-weight:600;padding:.4em .2em;margin-bottom:10px}
.hero{border-radius:18px;overflow:hidden;border:2px solid var(--gold);aspect-ratio:16/8;margin-bottom:22px}
.hero svg{display:block;width:100%;height:100%}
.read h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800}
.read .meta{color:var(--muted);margin:6px 0 22px}
.body{font-family:var(--read);font-size:var(--read-size);line-height:1.75;max-width:62ch}
.body p{margin:0 0 1.1em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 8px}
.btn{border:1.5px solid var(--accent);background:var(--card);color:var(--accent);border-radius:12px;padding:.55em 1.1em;font-weight:600}
.btn.fill{background:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;border-top:1px solid var(--line);padding-top:16px}

/* audio bar */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);color:#fff;border-top:3px solid var(--gold);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--gold-2);color:var(--navy);display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px;fill:currentColor}
.pm{flex:1;min-width:0}
.pm .name{font-family:var(--serif);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm input[type=range]{width:100%;accent-color:var(--gold-2);margin:4px 0 0}
.rate{background:rgba(255,255,255,.1);border:1px solid rgba(227,187,92,.6);border-radius:10px;padding:.3em .5em;color:#fff}
.rate option{color:#000}
.pnote{max-width:860px;margin:6px auto 0;font-size:.82rem;color:#C9D3E8}

/* settings dialog */
dialog{border:2px solid var(--gold);border-radius:20px;background:var(--card);color:var(--ink);padding:0;width:min(92vw,400px)}
dialog::backdrop{background:rgba(7,28,64,.6)}
.dl{padding:22px}
.dl h2{font-size:1.5rem;margin-bottom:16px}
.dl .grp{margin-bottom:18px}
.dl .lbl{font-weight:600;margin-bottom:8px;color:var(--muted);font-size:.95rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:.6em .4em;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

@media (max-width:520px){
  .thumb{width:68px;height:52px}
  .row h2{font-size:1.1rem}
  .rate{display:none}
}
@media (prefers-reduced-motion:reduce){
  .logo-big,.enter{animation:none}
  .gear:hover svg{transform:none}
}
.kw{font-weight:600;background:linear-gradient(transparent 60%,rgba(227,187,92,.5) 60%)}
.vh{font-size:1.3rem;margin:34px 0 10px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 28px;margin:0}
.vocab div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 0}
.vocab dt{font-weight:600;color:var(--accent)}
.vocab dd{margin:0;color:var(--muted);text-align:right}
#kinds .chip{font-family:var(--serif);font-size:1.05rem}
</style>
</head>

 en:{enter:"Enter",kText:"Texts",kEssay:"Essays",vocab:"Words from the text",more:"Show more",soon:"Essays are coming soon",texts:"Library",search:"Search texts by title",all:"All",fav:"Favorites",readOf:"{a} of {b} read",none:"Nothing found",noneHint:"Check the title or clear the filter.",favEmpty:"No favorites yet",favEmptyHint:"Tap the heart next to a text.",settings:"Settings",language:"Language",textSize:"Text size",theme:"Theme",auto:"Auto",light:"Light",dark:"Dark",close:"Close",back:"Back to list",prev:"Previous",next:"Next",min:"min",markRead:"Mark as read",isRead:"Read ✓",addFav:"Add to favorites",rmFav:"Remove from favorites",cont:"Continue: {t}",listen:"Listen",pause:"Pause",level:"Level",noTTS:"Audio is not supported in this browser.",ttsNote:"Read aloud by your device's voice. A speaker's recording can be attached to each text.",home:"Home"},

};

/* ---------- STATE / STORAGE ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang=store.get("lang","ru"); if(!I18N[lang]) lang="ru";
let theme=store.get("theme","auto");
let sizeIdx=store.get("size",1);
let favs=store.get("favs",[]);
let done=store.get("done",[]);
let last=store.get("last",null);
let filter="all", query="", kind="text", limit=20;
const SIZES=[17,19,22];

const $=s=>document.querySelector(s);
const t=(k,v)=>{let s=(I18N[lang][k]||I18N.ru[k]||k);if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
const ttl=x=>x.title[lang]||x.title.en;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- ART (drawn per text, no external images) ---------- */
function art(x){
  const id="g"+x.id;
  return '<svg viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+
   '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+x.c[0]+'"/><stop offset="1" stop-color="'+x.c[1]+'"/></linearGradient></defs>'+
   '<rect width="320" height="160" fill="url(#'+id+')"/>'+
   '<circle cx="160" cy="80" r="62" fill="none" stroke="#E3BB5C" stroke-width="3" opacity=".9"/>'+
   '<circle cx="160" cy="80" r="52" fill="#FBF8F0" opacity=".12"/>'+
   '<path d="M56 130c-18-20-22-48-8-80M44 70c10-4 16-12 18-22M46 92c12-2 20-10 22-22M54 112c12 0 20-8 24-20" fill="none" stroke="#E3BB5C" stroke-width="3" stroke-linecap="round"/>'+
   '<path d="M264 130c18-20 22-48 8-80M276 70c-10-4-16-12-18-22M274 92c-12-2-20-10-22-22M266 112c-12 0-20-8-24-20" fill="none" stroke="#E3BB5C" stroke-width="3" stroke-linecap="round"/>'+
   '<text x="160" y="98" font-size="58" font-weight="800" font-family="Playfair Display,Georgia,serif" fill="#FBF8F0" text-anchor="middle">'+x.emoji+'</text></svg>';
}

/* ---------- RENDER ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  $("#noneHintFix")&&0;
  $("#gear").setAttribute("aria-label",t("settings"));
  $("#toHome").setAttribute("aria-label",t("home"));
  document.querySelectorAll("#segLang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===lang));
  document.querySelectorAll("#segSize button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===sizeIdx));
  document.querySelectorAll("#segTheme button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===theme));
  document.documentElement.style.setProperty("--read-size",SIZES[sizeIdx]+"px");
  if(theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",theme);
}

function renderChips(){
  const levels=[...new Set(TEXTS.filter(x=>x.kind===kind).map(x=>x.lvl))];
  $("#kinds").innerHTML=[["text",t("kText")],["essay",t("kEssay")]].map(i=>{const c=TEXTS.filter(x=>x.kind===i[0]).length;return '<button class="chip" type="button" data-k="'+i[0]+'" aria-pressed="'+(kind===i[0])+'">'+esc(i[1])+(c?" ("+c+")":"")+'</button>'}).join("");
  const items=[["all",t("all")],["fav","♥ "+t("fav")]].concat(levels.map(l=>[l,l]));
  $("#chips").innerHTML=items.map(i=>'<button class="chip" type="button" data-f="'+i[0]+'" aria-pressed="'+(filter===i[0])+'">'+esc(i[1])+'</button>').join("");
}

function renderList(){
  renderChips();
  const q=query.trim().toLowerCase();
  const full=TEXTS.filter(x=>{
    if(x.kind!==kind)return false;
    if(filter==="fav"&&!favs.includes(x.id))return false;
    if(filter!=="all"&&filter!=="fav"&&x.lvl!==filter)return false;
    if(!q)return true;
    return Object.values(x.title).some(s=>s.toLowerCase().includes(q));
  });
  const list=full.slice(0,limit);
  $("#rows").innerHTML=list.map(x=>{
    const isF=favs.includes(x.id), isD=done.includes(x.id);
    const sub="";
    return '<li class="row"><button class="open" type="button" data-open="'+x.id+'"><span class="thumb">'+art(x)+'</span>'+
      '<span class="t"><h2>'+esc(ttl(x))+'</h2><div class="sub"><span class="pill">'+x.lvl+'</span>'+x.min+' '+t("min")+(isD?' · <span class="done">'+t("isRead")+'</span>':'')+(sub?' · '+sub:'')+'</div></span></button>'+
      '<button class="heart" type="button" data-fav="'+x.id+'" aria-pressed="'+isF+'" aria-label="'+(isF?t("rmFav"):t("addFav"))+'"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.4 5c2 0 3.6 1.1 4.6 2.7h2C14 6.1 15.600 5 17.600 5 21 5 22.800 8.600 21.500 11.800 19.500 16.400 12 21 12 21z"/></svg></button></li>';
  }).join("");
  const none=!full.length; const mb=$("#more"); mb.hidden=full.length<=limit; mb.textContent=t("more")+" ("+(full.length-limit)+")";
  $("#empty").hidden=!none;
  if(none){
    const favEmpty=filter==="fav"&&!q; const soon=kind==="essay"&&!TEXTS.some(x=>x.kind==="essay");
    $("#empty b").textContent=soon?t("soon"):favEmpty?t("favEmpty"):t("none");
    $("#empty span").textContent=soon?"":favEmpty?t("favEmptyHint"):t("noneHint");
  }
  $("#statTxt").textContent=t("readOf",{a:done.filter(i=>TEXTS.some(x=>x.id===i)).length,b:TEXTS.length});
  $("#statBar").style.width=(100*done.filter(i=>TEXTS.some(x=>x.id===i)).length/TEXTS.length)+"%";
  const lt=TEXTS.find(x=>x.id===last);
  const c=$("#cont");
  if(lt&&!q&&filter==="all"){c.hidden=false;c.textContent="▶ "+t("cont",{t:ttl(lt)});c.dataset.open=lt.id}else c.hidden=true;
}

let cur=null;
function renderRead(id){
  const i=TEXTS.findIndex(x=>x.id===id); if(i<0){go("#/texts");return}
  cur=TEXTS[i]; last=cur.id; store.set("last",last);
  $("#hero").innerHTML=art(cur);
  $("#rTitle").textContent=ttl(cur);
  $("#rMeta").textContent=""+t("level")+" "+cur.lvl+" · "+cur.min+" "+t("min");
  $("#rBody").innerHTML=cur.body.map(p=>"<p>"+p+"</p>").join("");
  $("#rVocab").innerHTML=cur.vocab&&cur.vocab.length?'<h2 class="vh">'+t("vocab")+'</h2><dl class="vocab">'+cur.vocab.map(v=>'<div><dt>'+esc(v[0])+'</dt><dd>'+esc(v[1])+'</dd></div>').join("")+'</dl>':"";
  $("#pName").textContent=cur.title.en;
  $("#prev").disabled=i===0; $("#next").disabled=i===TEXTS.length-1;
  $("#prev").dataset.go=i>0?TEXTS[i-1].id:""; $("#next").dataset.go=i<TEXTS.length-1?TEXTS[i+1].id:"";
  refreshReadBtns();
  initPlayer();
  window.scrollTo(0,0);
}
function refreshReadBtns(){
  if(!cur)return;
  $("#markRead").textContent=done.includes(cur.id)?t("isRead"):t("markRead");
  $("#favBtn").textContent=(favs.includes(cur.id)?"♥ ":"♡ ")+(favs.includes(cur.id)?t("rmFav"):t("addFav"));
}

/* ---------- PLAYER (audio file if provided, else device voice) ---------- */
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const synth=window.speechSynthesis;
const P={mode:"none",audio:null,text:"",pos:0,playing:false,token:0};

function setPlayUI(){
  $("#play").innerHTML=P.playing?ICON_PAUSE:ICON_PLAY;
  $("#play").setAttribute("aria-label",P.playing?t("pause"):t("listen"));
}
function stopPlayer(){
  P.token++;P.playing=false;
  if(synth)synth.cancel();
  if(P.audio){P.audio.pause();P.audio=null}
  setPlayUI();
}
function initPlayer(){
  stopPlayer();
  P.pos=0;$("#seek").value=0;
  const note=$("#pNote");
  if(cur.audio){
    P.mode="file";P.audio=new Audio();P.audio.preload="none";P.audio.src=cur.audio;P.audio.playbackRate=+$("#rate").value;
    P.audio.ontimeupdate=()=>{if(P.audio.duration)$("#seek").value=1000*P.audio.currentTime/P.audio.duration};
    P.audio.onended=()=>{P.playing=false;setPlayUI()};
    note.hidden=true;
  }else if(synth){
    P.mode="tts";P.text=cur.body.join(" ").replace(/<[^>]+>/g,"");note.hidden=false;note.textContent=t("ttsNote");
  }else{P.mode="none";note.hidden=false;note.textContent=t("noTTS")}
  setPlayUI();
}
function speakFrom(pos){
  synth.cancel();
  const my=++P.token;
  const u=new SpeechSynthesisUtterance(P.text.slice(pos));
  u.lang="en-US";u.rate=+$("#rate").value;
  u.onboundary=e=>{if(my!==P.token)return;P.pos=pos+e.charIndex;$("#seek").value=1000*P.pos/P.text.length};
  u.onend=()=>{if(my!==P.token)return;P.playing=false;P.pos=0;$("#seek").value=0;setPlayUI()};
  u.onerror=()=>{if(my!==P.token)return;P.playing=false;setPlayUI()};
  P.pos=pos;P.playing=true;setPlayUI();
  synth.speak(u);
}
function togglePlay(){
  if(P.mode==="file"){
    if(P.playing){P.audio.pause();P.playing=false}else{P.audio.play();P.playing=true}
    setPlayUI();
  }else if(P.mode==="tts"){
    if(P.playing){P.token++;synth.cancel();P.playing=false;setPlayUI()}else speakFrom(P.pos);
  }
}
$("#play").addEventListener("click",togglePlay);
$("#seek").addEventListener("change",e=>{
  const f=+e.target.value/1000;
  if(P.mode==="file"&&P.audio&&P.audio.duration){P.audio.currentTime=f*P.audio.duration}
  else if(P.mode==="tts"){
    let pos=Math.floor(f*P.text.length);const sp=P.text.indexOf(" ",pos);if(sp>0)pos=sp+1;
    if(P.playing)speakFrom(pos);else P.pos=pos;
  }
});
$("#rate").addEventListener("change",e=>{
  if(P.mode==="file"&&P.audio)P.audio.playbackRate=+e.target.value;
  else if(P.mode==="tts"&&P.playing)speakFrom(P.pos);
});

/* ---------- ROUTING ---------- */
function go(h){if(location.hash===h)route();else location.hash=h}
function show(v){
  ["home","list","read"].forEach(n=>$("#v-"+n).hidden=n!==v);
  document.documentElement.classList.toggle("on-home",v==="home");
}
function route(){
  const h=location.hash||"#/";
  if(h.startsWith("#/text/")){stopPlayer();show("read");renderRead(decodeURIComponent(h.slice(7)))}
  else if(h==="#/texts"){stopPlayer();show("list");renderList();window.scrollTo(0,0)}
  else{stopPlayer();show("home")}
}
window.addEventListener("hashchange",route);

/* ---------- EVENTS ---------- */
$("#enter").addEventListener("click",()=>go("#/texts"));
$("#toHome").addEventListener("click",()=>go("#/"));
$("#back").addEventListener("click",()=>go("#/texts"));
$("#q").addEventListener("input",e=>{query=e.target.value;limit=20;renderList()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;limit=20;renderList()});
$("#rows").addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){toggleFav(f.dataset.fav);renderList();return}
  const o=e.target.closest("[data-open]");if(o)go("#/text/"+encodeURIComponent(o.dataset.open));
});
$("#kinds").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;kind=b.dataset.k;filter="all";limit=20;renderList()});
$("#more").addEventListener("click",()=>{limit+=20;renderList()});
$("#cont").addEventListener("click",e=>go("#/text/"+encodeURIComponent(e.currentTarget.dataset.open)));
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):favs.concat(id);store.set("favs",favs)}
$("#favBtn").addEventListener("click",()=>{toggleFav(cur.id);refreshReadBtns()});
$("#markRead").addEventListener("click",()=>{
  done=done.includes(cur.id)?done.filter(x=>x!==cur.id):done.concat(cur.id);store.set("done",done);refreshReadBtns();
});
["prev","next"].forEach(n=>$("#"+n).addEventListener("click",e=>{const g=e.currentTarget.dataset.go;if(g)go("#/text/"+encodeURIComponent(g))}));

const dlg=$("#dlg");
$("#gear").addEventListener("click",()=>dlg.showModal());
$("#closeDlg").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
$("#segLang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.v;store.set("lang",lang);refreshAll()});
$("#segSize").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;sizeIdx=+b.dataset.v;store.set("size",sizeIdx);applyStatic()});
$("#segTheme").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;theme=b.dataset.v;store.set("theme",theme);applyStatic()});

function refreshAll(){
  applyStatic();
  if(!$("#v-list").hidden)renderList();
  if(!$("#v-read").hidden&&cur){
    const was=P.playing;
    $("#rTitle").textContent=ttl(cur);
    $("#rMeta").textContent=""+t("level")+" "+cur.lvl+" · "+cur.min+" "+t("min");
    refreshReadBtns();setPlayUI();
    const n=$("#pNote");if(!n.hidden)n.textContent=P.mode==="tts"?t("ttsNote"):t("noTTS");
  }
}

applyStatic();
route();
})();
</script>
</body>
</html>
